name: kernel-build
variant: scratch
shell: /bin/bash
dependencies:
  - stage: kernel-prepare
steps:
  - env:
      CARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}amd64{{ else if eq .ARCH "riscv64" }}riscv64{{ else }}unsupported{{ end }}
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86{{ else if eq .ARCH "riscv64" }}riscv{{ else }}unsupported{{ end }}
      LLVM: 1
      KBUILD_OUTPUT: /src/build
    cachePaths:
      - /src/build{{ if eq .ARCH "riscv64" }}
    # Built into vmlinux (CONFIG_EXTRA_FIRMWARE): Talos ships no
    # /lib/firmware, and the TH1520 BXM-4-64 GPU and the Lichee Pi 4A
    # RTL8723DS Wi-Fi need these to start.
    sources:
      - url: https://gitlab.com/kernel-firmware/linux-firmware/-/raw/{{ .linux_firmware_version }}/powervr/rogue_36.52.104.182_v1.fw
        destination: rogue_36.52.104.182_v1.fw
        sha256: e0cdfda85e6f44d5591f94bde7e6b52a772eef21c80baa1c14d3efdf8e90747a
        sha512: 461b18f868c898c929d4e9d489880295455b48fba0769e67c59a1641fa8ddfb4b639cf34a94a9fb56572cde6c7b5b184c3744f274226d45e4eae642ef08c0aa1
      # Lichee Pi 4A RTL8723DS Wi-Fi (rtw88_8723ds)
      - url: https://gitlab.com/kernel-firmware/linux-firmware/-/raw/{{ .linux_firmware_version }}/rtw88/rtw8723d_fw.bin
        destination: rtw8723d_fw.bin
        sha256: 9c64e079815a333a3f7b731be7cc0be65206ebc883891659dc8ff5ed36a5e2f5
        sha512: a8831d9be69fbbe06097886054f514aa644bdedbdb48cffe8a59f06cdbfde4c9d23c6f0a75d20f62c8f2c3f8a005d1a5f607ce499f2bdb12df387d390108f82a{{ end }}
    prepare:
      - |{{ if eq .ARCH "riscv64" }}
        mkdir -p /src/firmware/powervr
        cp -v rogue_36.52.104.182_v1.fw /src/firmware/powervr/
        mkdir -p /src/firmware/rtw88
        cp -v rtw8723d_fw.bin /src/firmware/rtw88/{{ end }}
        cd /src
        cp -v /pkg/config-${CARCH} ${KBUILD_OUTPUT}/.config
        cp -v /pkg/certs/* certs/
      - |
        cd /src
        for patch in $(find /pkg/patches -type f -name "*.patch" | sort); do
          patch -p1 < $patch || (echo "Failed to apply patch $patch" && exit 1)
          echo "Applied patch $patch"
        done
    build:
      {{ if .BUILD_ARG_KERNEL_TARGET }}
      - |
        cd /src

        make {{ .BUILD_ARG_KERNEL_TARGET }}
        # KBUILD_OUTPUT is a cache mount, so it isn't part of the snapshot finalize reads
        cp ${KBUILD_OUTPUT}/.config /src/.config
      {{ else }}
      - |
        cd /src
        python3 /toolchain/kernel-hardening-checker/bin/kernel-hardening-checker -c ${KBUILD_OUTPUT}/.config -m json | python3 /pkg/scripts/filter-hardened-check.py ${CARCH}
      - |
        cd /src

        # KBUILD_OUTPUT is a cache mount, not part of this stage's snapshot.
        # Module packages read it via their own /src/build cache mount, so if
        # the cache is evicted while this layer stays cached, change this step
        # to force a rebuild.{{ if eq .ARCH "riscv64" }}
        # LLVM 20+ merges globals on riscv64, and pahole 1.31 then writes
        # overlapping percpu offsets into BTF, so every module fails to load
        # with "failed to validate module BTF: -22". pahole 1.32 has the fix.
        # https://github.com/ClangBuiltLinux/linux/issues/2089
        export KCFLAGS="-mllvm -riscv-enable-global-merge=false"{{ end }}
        make -j $(nproc)
        make -j $(nproc) modules

        if [ "${ARCH}" = "arm64" ] || [ "${ARCH}" = "riscv" ]; then
          echo "Compiling device-tree blobs"
          make -j $(nproc) DTC_FLAGS=-@ dtbs
        fi
      {{ end }}
finalize:
  {{ if .BUILD_ARG_KERNEL_TARGET }}
  - from: /src/.config
    to: config-{{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}amd64{{ else if eq .ARCH "riscv64" }}riscv64{{ else }}unsupported{{ end }}
  {{ else }}
  - from: /src
    to: /src
  - from: /toolchain
    to: /toolchain
  {{ end }}
