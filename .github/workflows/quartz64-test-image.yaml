# Test-only workflow: builds the arm64 kernel from this branch, a Talos imager
# using that kernel, the sbc-rockchip overlay, and a SOQuartz CM4 disk image.
# Not intended for upstream.
name: quartz64-test-image

'on':
  push:
    branches:
      - claude/quartz64-kernel-mexpbk
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: Reuse an already pushed kernel tag instead of building one
        required: false
        default: ''

concurrency:
  group: quartz64-test-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  USERNAME: ${{ github.repository_owner }}/talos-pkgs
  TALOS_REPO: pl4nty/talos
  TALOS_REF: claude/quartz64-kernel-mexpbk
  SBC_REPO: pl4nty/talos-sbc-rockchip
  SBC_REF: claude/quartz64-kernel-mexpbk
  OVERLAY_NAME: soquartz-cm4

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
        with:
          # full history so the tag below finds the last kernel commit, not HEAD
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        # keyed on the last commit touching the kernel, so CI-only commits reuse the pushed kernel
        run: |
          # pinned to the last built kernel so overlay-only pushes don't rebuild it; clear when kernel/ changes
          tag=${{ inputs.kernel_tag || 'quartz64-5e6fc8a56814' }}
          tag=${tag:-quartz64-$(git log -1 --format=%h --abbrev=12 -- kernel/ Pkgfile)}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker manifest inspect $REGISTRY/$USERNAME/kernel:$tag >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Normalize kernel config (olddefconfig)
        if: steps.tag.outputs.exists != 'true'
        run: |
          make local-kernel-build TARGET_ARGS="--build-arg=KERNEL_TARGET=olddefconfig" \
            PLATFORM=linux/arm64 PROGRESS=plain DEST=kernel/build
          git diff kernel/build/config-arm64 | tee config-arm64.diff
      - uses: actions/upload-artifact@v4
        if: steps.tag.outputs.exists != 'true'
        with:
          name: config-arm64
          path: |
            kernel/build/config-arm64
            config-arm64.diff
      - name: Build and push kernel
        if: steps.tag.outputs.exists != 'true'
        run: |
          make kernel PLATFORM=linux/arm64 PROGRESS=plain PUSH=true \
            REGISTRY=$REGISTRY USERNAME=$USERNAME TAG=${{ steps.tag.outputs.tag }}
      - name: List modules added by this branch
        run: |
          id=$(docker create --platform linux/arm64 $REGISTRY/$USERNAME/kernel:${{ steps.tag.outputs.tag }} /bin/true)
          docker cp $id:/ ./kroot
          find kroot -name 'motorcomm*' | sort
          grep -E 'MOTORCOMM' kroot/boot/config* || true

  talos:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TALOS_REPO }}
          ref: ${{ env.TALOS_REF }}
          fetch-depth: 0
      - name: Fetch upstream tags
        run: git fetch --force --tags https://github.com/siderolabs/talos main
      - id: tag
        run: echo "tag=$(git describe --tag --always --match 'v[0-9]*')-quartz64" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push installer-base and imager
        # skip when this Talos commit is already built, so overlay-only iterations are quick
        run: |
          if docker manifest inspect $REGISTRY/$USERNAME/imager:${{ steps.tag.outputs.tag }} >/dev/null 2>&1 &&
             docker manifest inspect $REGISTRY/$USERNAME/installer-base:${{ steps.tag.outputs.tag }} >/dev/null 2>&1; then
            echo "already built"; exit 0
          fi
          make installer-base imager PLATFORM=linux/arm64 INSTALLER_ARCH=targetarch PROGRESS=plain PUSH=true \
            REGISTRY=$REGISTRY USERNAME=$USERNAME TAG=${{ steps.tag.outputs.tag }} \
            PKG_KERNEL=$REGISTRY/$USERNAME/kernel:${{ needs.kernel.outputs.tag }}

  image:
    needs: talos
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SBC_REPO }}
          ref: ${{ env.SBC_REF }}
          fetch-depth: 0
      - id: tag
        run: echo "tag=quartz64-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trim the overlay to SOQuartz only
        # test-only: building every board's U-Boot and DTB wastes most of the job
        run: |
          python3 - <<'PY'
          import yaml
          p = "installers/pkg.yaml"
          d = yaml.safe_load(open(p))
          keep = lambda dep: dep.get("stage") in ("soquartz-cm4", "u-boot-soquartz-cm4", "profiles") \
              or "soquartz" in dep.get("to", "")
          d["dependencies"] = [dep for dep in d["dependencies"] if keep(dep)]
          yaml.safe_dump(d, open(p, "w"), sort_keys=False)
          PY
          cat installers/pkg.yaml
      - name: Build and push sbc-rockchip overlay
        run: |
          make sbc-rockchip PLATFORM=linux/arm64 PROGRESS=plain PUSH=true \
            REGISTRY=$REGISTRY USERNAME=$USERNAME TAG=${{ steps.tag.outputs.tag }}
      - name: Build disk image and installer
        run: |
          IMAGER=$REGISTRY/$USERNAME/imager:${{ needs.talos.outputs.tag }}
          ARGS="--arch arm64 \
            --base-installer-image $REGISTRY/$USERNAME/installer-base:${{ needs.talos.outputs.tag }} \
            --overlay-image $REGISTRY/$USERNAME/sbc-rockchip:${{ steps.tag.outputs.tag }} \
            --overlay-name $OVERLAY_NAME"
          mkdir -p _out
          # sbc profiles need grub: sd-boot skips the overlay install step (U-Boot + DTB) in image mode.
          # A stdin profile ignores the CLI flags, so inputs and overlay go in the YAML.
          cat <<PROFILE | docker run --rm -i --privileged -v /dev:/dev -v $PWD/_out:/out $IMAGER -
          arch: arm64
          platform: metal
          secureboot: false
          input:
            baseInstaller:
              imageRef: $REGISTRY/$USERNAME/installer-base:${{ needs.talos.outputs.tag }}
            overlayInstaller:
              imageRef: $REGISTRY/$USERNAME/sbc-rockchip:${{ steps.tag.outputs.tag }}
          overlay:
            name: $OVERLAY_NAME
            image:
              imageRef: $REGISTRY/$USERNAME/sbc-rockchip:${{ steps.tag.outputs.tag }}
          output:
            kind: image
            outFormat: .zst
            imageOptions:
              diskSize: 1306525696
              diskFormat: raw
              bootloader: grub
          PROFILE
          docker run --rm -t --privileged -v /dev:/dev -v $PWD/_out:/out $IMAGER installer $ARGS
          ls -la _out
      - name: Check U-Boot and DTB are in the image
        run: |
          zstd -d -q -o metal.raw _out/metal-arm64.raw.zst
          dd if=metal.raw bs=512 skip=64 count=1 2>/dev/null | od -A n -c | head -2
          test "$(dd if=metal.raw bs=512 skip=64 count=4 2>/dev/null | tr -d '\0' | wc -c)" -gt 0
          grep -a -c 'soquartz' metal.raw
          rm metal.raw
      - uses: imjasonh/setup-crane@v0.4
      - name: Push overlay installer
        run: |
          crane push _out/installer-arm64.tar \
            $REGISTRY/$USERNAME/installer:$OVERLAY_NAME-${{ needs.talos.outputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: talos-${{ env.OVERLAY_NAME }}-${{ needs.talos.outputs.tag }}
          path: _out/metal-arm64.raw.*
          if-no-files-found: error
          compression-level: 0
